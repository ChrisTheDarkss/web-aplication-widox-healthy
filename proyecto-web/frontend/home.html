<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widox Gym</title>
    <link rel="stylesheet" href="estiloHome.css">
</head>
<body>
    <header>
        <a href="#" class="logo"> 
            <img src="img/logo.png" alt="logo">
        </a>
        <nav class="nav-links">
            <a href="ejercicios.html" class="nav-link">Ejercicios</a>
            <a href="alimentacion.html" class="nav-link">Alimentación</a>
            <a href="imc.html" class="nav-link">IMC</a>
        </nav>
        <div class="iconos">
            <a href="login.html" id="linkLogin">login</a>
        </div>
    </header>

    <div class="fila-arriba">
    <a href="ejercicios.html">
        <img src="img/ejercicio.webp" alt="Foto" class="ejercicio" width="400">
    </a>
    <a href="alimentacion.html">
        <img src="img/alimentacion.jpg" alt="Foto" class="Comida" width="400">

</div>

<div class="fila-abajo">
    <a href="imc.html">
        <img src="img/imc.jpg" alt="Foto" class="imc" width="400">
    </a>
<script>
    // 1. Buscamos si hay un usuario guardado
    const usuario = localStorage.getItem('usuarioActivo');
    const enlace = document.getElementById('linkLogin');

    // 2. Si existe un usuario, cambiamos el texto
    if (usuario && enlace) {
        // Cambiamos "login" por el nombre del usuario
        enlace.textContent = usuario; 
        
        // Opcional: Cambiamos el link para que ahora sirva para cerrar sesión
        enlace.href = "#"; 
        enlace.onclick = function() {
            // Al hacer click, borramos el usuario (Cerrar sesión)
            localStorage.removeItem('usuarioActivo');
            window.location.reload(); // Recargamos la página
        };
    }
</script>
</body>
</html>
</div>
</body>
</html>
