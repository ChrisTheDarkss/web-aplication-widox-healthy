version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_crud
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: usuarios_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - crud_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: node_backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: app_user
      DB_PASSWORD: userpassword
      DB_NAME: usuarios_db
      DB_PORT: 3306
    volumes:
      - ./frontend:/app/frontend
    networks:
      - crud_network

volumes:
  mysql_data:

networks:
  crud_network:
    driver: bridge